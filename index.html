<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ダンジョンウィズイン 編成ビルダー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Monster Builder</p>
          <h1>ダンジョンウィズイン 編成ビルダー</h1>
          <p class="app-version" data-app-version></p>
          <p id="schema-load-status" class="data-transfer-status" role="status" aria-live="polite"></p>
        </div>
        <a href="monster-editor.html" class="primary-btn editor-link">モンスター編集</a>
      </header>

      <main class="layout">
        <section class="panel team-panel">
          <div class="panel-header">
            <h2>現在の編成</h2>
            <div class="team-header-actions">
              <button id="open-monster-picker" type="button" class="primary-btn">モンスターを追加</button>
              <button id="clear-btn" class="ghost-btn">クリア</button>
            </div>
          </div>

          <div class="summary-grid">
            <div class="summary-item">
              <span>支配力</span>
              <strong id="team-control">0</strong>
            </div>
          </div>

          <section class="balance-summary" aria-label="バランスサマリ">
            <h3>バランスサマリ</h3>
            <div class="balance-charts">
              <div id="status-balance"></div>
              <div id="skill-balance"></div>
            </div>
          </section>

          <details class="formation-saves" open>
            <summary>保存編成（最大3件）</summary>
            <div id="formation-save-list" class="formation-save-list"></div>
            <p id="formation-save-status" class="formation-save-status" role="status" aria-live="polite"></p>
          </details>

          <div id="team-list" class="team-list"></div>
        </section>

        <section class="panel sim-panel">
          <div class="panel-header">
            <h2>パーツシミュレーション</h2>
          </div>
          <div id="part-simulator" class="part-simulator"></div>
        </section>

        <div id="part-selector-modal" class="modal-backdrop hidden" aria-hidden="true"></div>

        <section class="panel suggestion-panel">
          <div class="panel-header">
            <h2>おすすめ編成</h2>
          </div>
          <div id="suggestion-result" class="suggestion-box">
            まだ候補がありません。
          </div>
        </section>
      </main>
    </div>

    <dialog id="monster-picker" class="monster-picker" aria-labelledby="monster-picker-title">
      <div class="modal-header">
        <h3 id="monster-picker-title">モンスターを追加</h3>
        <button id="close-monster-picker" type="button" class="close-btn">閉じる</button>
      </div>
      <div class="monster-picker-columns">
        <section class="monster-picker-selected" aria-labelledby="monster-picker-team-title">
          <h4 id="monster-picker-team-title">現在の編成</h4>
          <div id="monster-picker-team" class="team-list"></div>
        </section>
        <section class="monster-picker-roster" aria-labelledby="monster-picker-roster-title">
          <div class="panel-header">
            <h4 id="monster-picker-roster-title">モンスター一覧</h4>
            <span id="roster-count" class="badge">0体</span>
          </div>
          <div class="roster-filters">
            <label class="filter-control">
              <span>種族</span>
              <select id="race-filter"><option value="all">すべて</option></select>
            </label>
            <label class="filter-control">
              <span>等級</span>
              <select id="rank-filter"><option value="all">すべて</option></select>
            </label>
          </div>
          <div class="stat-filter-box">
            <div class="stat-filter-label">ステータス</div>
            <div id="stat-filter-list" class="stat-filter-list"></div>
          </div>
          <div id="unit-list" class="unit-list"></div>
        </section>
      </div>
    </dialog>

    <script src="app-version.js"></script>
    <script src="schema-data.js"></script>
    <script type="module">
      try {
        await window.MonsterSchema.initialize();
        await import('./app.js');
      } catch (error) {
        console.error('Failed to initialize the new monster schema.', error);
        const status = document.getElementById('schema-load-status');
        status.textContent = `モンスターデータを読み込めませんでした：${error.message}`;
        status.classList.add('error');
      }
    </script>
  </body>
</html>
