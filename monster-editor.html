<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>モンスターデータ編集</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell editor-page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Monster Builder · Schema v1.0</p>
          <h1>モンスターデータ編集</h1>
          <p class="app-version" data-app-version></p>
          <p id="data-transfer-status" class="data-transfer-status" role="status" aria-live="polite"></p>
        </div>
        <div class="topbar-actions">
          <a href="index.html" class="ghost-btn editor-link">ビルダーへ戻る</a>
          <button id="export-monster-data" type="button" class="ghost-btn">エクスポート</button>
          <button id="import-monster-data" type="button" class="ghost-btn">インポート</button>
          <button id="refresh-latest-monster-data" type="button" class="ghost-btn">最新データを反映</button>
          <button id="reset-monster-data" type="button" class="ghost-btn">初期データに戻す</button>
          <button id="save-monster-data" type="button" class="primary-btn">保存</button>
          <input id="import-monster-file" type="file" accept=".json,application/json" hidden />
        </div>
      </header>

      <main class="editor-layout">
        <aside class="panel editor-sidebar">
          <div class="panel-header">
            <h2>モンスター一覧</h2>
            <button id="add-monster-btn" type="button" class="ghost-btn small-btn">追加</button>
          </div>
          <div id="monster-list" class="monster-list"></div>
        </aside>

        <section class="panel editor-main">
          <div id="editor-empty" class="empty-team hidden">モンスターを選んで編集してください。</div>
          <form id="monster-schema-form" class="editor-form hidden" onsubmit="return false;"></form>
        </section>
      </main>
    </div>

    <dialog id="new-monster-dialog" class="schema-new-monster-dialog">
      <form id="new-monster-form">
        <h2>新規モンスター</h2>
        <p>英語名からIDを自動生成します。</p>
        <label class="schema-field">
          <span>英語名（必須）</span>
          <input id="new-monster-english-name" type="text" required autocomplete="off" />
        </label>
        <div class="schema-dialog-actions">
          <button id="cancel-new-monster" type="button" class="ghost-btn">キャンセル</button>
          <button type="submit" class="primary-btn">追加</button>
        </div>
      </form>
    </dialog>

    <script src="app-version.js"></script>
    <script src="schema-data.js"></script>
    <script type="module">
      try {
        await window.MonsterSchema.initialize();
        await import('./schema-editor.js');
      } catch (error) {
        console.error('Failed to initialize the schema editor.', error);
        const status = document.getElementById('data-transfer-status');
        status.textContent = `モンスターデータを読み込めませんでした：${error.message}`;
        status.classList.add('error');
      }
    </script>
  </body>
</html>
